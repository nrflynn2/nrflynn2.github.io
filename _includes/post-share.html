<div class="post-share">
  <span class="post-share__label">Share this essay</span>
  <ul class="post-share__list">
    <li>
      <a href="https://twitter.com/intent/tweet?text={{ page.title | url_encode }}&url={{ page.url | absolute_url | url_encode }}" target="_blank" rel="noopener" aria-label="Share on X"><i class="fa-brands fa-x-twitter"></i> X</a>
    </li>
    <li>
      <a href="https://www.linkedin.com/sharing/share-offsite/?url={{ page.url | absolute_url | url_encode }}" target="_blank" rel="noopener" aria-label="Share on LinkedIn"><i class="fa-brands fa-linkedin-in"></i> LinkedIn</a>
    </li>
    <li>
      <a href="https://bsky.app/intent/compose?text={{ page.title | url_encode }}%20{{ page.url | absolute_url | url_encode }}" target="_blank" rel="noopener" aria-label="Share on Bluesky"><i class="fa-brands fa-bluesky"></i> Bluesky</a>
    </li>
    <li>
      <a href="https://news.ycombinator.com/submitlink?u={{ page.url | absolute_url | url_encode }}&t={{ page.title | url_encode }}" target="_blank" rel="noopener" aria-label="Submit to Hacker News"><i class="fa-brands fa-hacker-news"></i> HN</a>
    </li>
    <li>
      <a href="mailto:?subject={{ page.title | uri_escape }}&body={{ page.url | absolute_url | url_encode }}" aria-label="Share by email"><i class="fa-solid fa-envelope"></i> Email</a>
    </li>
    <li>
      <button type="button" class="post-share__copy" data-url="{{ page.url | absolute_url }}" aria-label="Copy link"><i class="fa-solid fa-link"></i> Copy link</button>
    </li>
  </ul>
</div>
<script>
  document.querySelectorAll(".post-share__copy").forEach((btn) => {
    btn.addEventListener("click", () => {
      navigator.clipboard.writeText(btn.dataset.url).then(() => {
        const label = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-check"></i> Copied';
        setTimeout(() => (btn.innerHTML = label), 2000);
      });
    });
  });
</script>
